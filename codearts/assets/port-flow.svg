<svg viewBox="0 0 720 880" width="720" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Title: 内容跨 x=30..690，中心 x=360 -->
  <text x="360" y="28" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">CodeArts 桌面智能体跨平台移植流程</text>

  <!-- ============ 输入源（y=50, h=54, bottom=104） ============ -->

  <!-- mac zip: x=30, w=230, center=145 -->
  <rect x="30" y="50" width="230" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="145" y="72" font-size="12" fill="#1e40af" text-anchor="middle">CodeArts-&lt;ver&gt;-arm64.zip</text>
  <text x="145" y="92" font-size="10" fill="#64748b" text-anchor="middle">app.asar · unpacked · icon · product.json</text>

  <!-- Electron zip: x=290, w=170, center=375 -->
  <rect x="290" y="50" width="170" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="375" y="72" font-size="12" fill="#b45309" text-anchor="middle">Electron linux-x64</text>
  <text x="375" y="92" font-size="10" fill="#64748b" text-anchor="middle">Linux 原生 runtime</text>

  <!-- 内核 deb: x=490, w=200, center=590 -->
  <rect x="490" y="50" width="200" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="590" y="72" font-size="12" fill="#6b21a8" text-anchor="middle">agent-kernel deb（可选）</text>
  <text x="590" y="92" font-size="10" fill="#64748b" text-anchor="middle">agentkernelServer-linux-x64</text>

  <!-- 输入 → 脚本条: bottom=104+5=109 → top-11=129（同轴垂直） -->
  <path d="M145,109 L 145,129" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M375,109 L 375,129" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M590,109 L 590,129" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <!-- 脚本条: x=160, y=140, w=400, h=22, bottom=162 -->
  <rect x="160" y="140" width="400" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="155" font-size="11" fill="#64748b" text-anchor="middle">port.sh</text>

  <!-- 脚本条 → step1: 162+5=167 → 195-11=184 -->
  <path d="M360,167 L 360,184" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 处理步骤（x=200, w=320, center=360, h=54, 间距 25px） ============ -->

  <!-- Step 1: y=195, bottom=249 -->
  <rect x="200" y="195" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="209" font-size="11" fill="#64748b">1</text>
  <text x="360" y="217" font-size="12" fill="#1e293b" text-anchor="middle">解压源 zip，提取 app.asar 与配置</text>
  <text x="360" y="235" font-size="10" fill="#64748b" text-anchor="middle">app.asar · unpacked · icon · product.json</text>

  <!-- Arrow 1→2: 249+5=254 → 274-11=263 -->
  <path d="M360,254 L 360,263" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: y=274, bottom=328 -->
  <rect x="200" y="274" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="288" font-size="11" fill="#64748b">2</text>
  <text x="360" y="296" font-size="12" fill="#1e293b" text-anchor="middle">解压 app.asar 为目录</text>
  <text x="360" y="314" font-size="10" fill="#64748b" text-anchor="middle">npx asar@3.2.0 extract → app/</text>

  <!-- Arrow 2→3: 328+5=333 → 353-11=342 -->
  <path d="M360,333 L 360,342" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: y=353, bottom=407 -->
  <rect x="200" y="353" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="367" font-size="11" fill="#64748b">3</text>
  <text x="360" y="375" font-size="12" fill="#1e293b" text-anchor="middle">替换平台原生模块</text>
  <text x="360" y="393" font-size="10" fill="#64748b" text-anchor="middle">移除 *.node · atomgit-cli 从 npm 补齐</text>

  <!-- Arrow 3→4: 407+5=412 → 432-11=421 -->
  <path d="M360,412 L 360,421" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: y=432, bottom=486 -->
  <rect x="200" y="432" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="446" font-size="11" fill="#64748b">4</text>
  <text x="360" y="454" font-size="12" fill="#1e293b" text-anchor="middle">sidecar 处理（agent-kernel）</text>
  <text x="360" y="472" font-size="10" fill="#64748b" text-anchor="middle">agent-kernel.real + wrapper 转接 · officecli 跳过</text>

  <!-- Arrow 4→5: 486+5=491 → 511-11=500 -->
  <path d="M360,491 L 360,500" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: y=511, bottom=565 -->
  <rect x="200" y="511" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="525" font-size="11" fill="#64748b">5</text>
  <text x="360" y="533" font-size="12" fill="#1e293b" text-anchor="middle">下载 Electron linux-x64 runtime</text>
  <text x="360" y="551" font-size="10" fill="#64748b" text-anchor="middle">electron-v39.3.0-linux-x64.zip</text>

  <!-- Arrow 5→6: 565+5=570 → 590-11=579 -->
  <path d="M360,570 L 360,579" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: y=590, bottom=644 -->
  <rect x="200" y="590" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="604" font-size="11" fill="#64748b">6</text>
  <text x="360" y="612" font-size="12" fill="#1e293b" text-anchor="middle">组装应用目录 /opt/codearts</text>
  <text x="360" y="630" font-size="10" fill="#64748b" text-anchor="middle">icns → hicolor · launcher · desktop · bin/</text>

  <!-- Arrow 6→7: 644+5=649 → 669-11=658 -->
  <path d="M360,649 L 360,658" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 7: y=669, bottom=723 -->
  <rect x="200" y="669" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="683" font-size="11" fill="#64748b">7</text>
  <text x="360" y="691" font-size="12" fill="#1e293b" text-anchor="middle">打包 deb / rpm</text>
  <text x="360" y="709" font-size="10" fill="#64748b" text-anchor="middle">版本号取 asar 内 package.json</text>

  <!-- ============ 产物（y=753, h=36, bottom=789） ============ -->

  <!-- deb: x=128, w=220, center=238 -->
  <rect x="128" y="753" width="220" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="238" y="775" font-size="12" fill="#166534" text-anchor="middle">codearts_&lt;ver&gt;_amd64.deb</text>

  <!-- rpm: x=373, w=220, center=483 -->
  <rect x="373" y="753" width="220" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="483" y="775" font-size="12" fill="#166534" text-anchor="middle">codearts-&lt;ver&gt;.x86_64.rpm</text>

  <!-- Step7 → 两个产物: 723+5=728 → 753-11=742 -->
  <path d="M300,728 C 300,742 238,736 238,742" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M420,728 C 420,742 483,736 483,742" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ============ 图例（居中，y=822） ============ -->
  <rect x="151" y="822" width="12" height="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="169" y="832" font-size="10" fill="#64748b">输入</text>
  <rect x="241" y="822" width="12" height="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="259" y="832" font-size="10" fill="#64748b">Electron</text>
  <rect x="351" y="822" width="12" height="12" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="369" y="832" font-size="10" fill="#64748b">sidecar</text>
  <rect x="451" y="822" width="12" height="12" fill="#d1fae5" stroke="#22c55e"/>
  <text x="469" y="832" font-size="10" fill="#64748b">产物</text>
  <rect x="531" y="822" width="12" height="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="549" y="832" font-size="10" fill="#64748b">处理</text>

  <!-- 注记 -->
  <text x="360" y="852" font-size="10" fill="#9d174d" text-anchor="middle">⚠ agent-kernel 需 -k 提供官方 Linux deb；officecli 无 linux 产物，已跳过</text>
</svg>
