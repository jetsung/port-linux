<svg viewBox="0 0 720 600" width="720" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Title: content spans x=95 to x=625, center=360 -->
  <text x="360" y="28" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">CodeArts 桌面智能体跨平台移植流程</text>

  <!-- ============ 输入源 ============ -->

  <!-- mac zip: x=95, y=50, w=260, h=54, center=225, bottom=104 -->
  <rect x="95" y="50" width="260" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="225" y="72" font-size="12" fill="#1e40af" text-anchor="middle">CodeArts-&lt;ver&gt;-arm64.zip (mac)</text>
  <text x="225" y="92" font-size="10" fill="#64748b" text-anchor="middle">app.asar（平台无关）· app.asar.unpacked · icon.icns</text>

  <!-- Electron zip: x=430, y=50, w=230, h=54, center=545, bottom=104 -->
  <rect x="430" y="50" width="230" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="545" y="72" font-size="12" fill="#b45309" text-anchor="middle">Electron linux-x64 zip</text>
  <text x="545" y="92" font-size="10" fill="#64748b" text-anchor="middle">Linux 原生 runtime（Electron 39.3.0）</text>

  <!-- 脚本条: x=200, y=140, w=320, h=22, center=360, top=140, bottom=162 -->
  <rect x="200" y="140" width="320" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="155" font-size="11" fill="#64748b" text-anchor="middle">port-codearts.sh</text>

  <!-- mac zip → 脚本条: bottom=104 → top-11=129 -->
  <path d="M225,109 C 225,120 220,118 220,129" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Electron → 脚本条: bottom=104 → top-11=129 -->
  <path d="M545,109 C 545,120 500,118 500,129" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- ============ 处理步骤 ============ -->

  <!-- Step 1: y=195, w=320, h=54, bottom=249 -->
  <rect x="200" y="195" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="209" font-size="11" fill="#64748b">1</text>
  <text x="360" y="217" font-size="12" fill="#1e293b" text-anchor="middle">提取 app.asar / unpacked / icon（跳过 darwin runtime）</text>
  <text x="360" y="235" font-size="10" fill="#64748b" text-anchor="middle">npx asar extract → app/</text>

  <!-- 脚本条 → step1: bottom=162+5=167 → 195-11=184 -->
  <path d="M360,167 L 360,184" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: y=278, h=54, bottom=332 -->
  <rect x="200" y="278" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="292" font-size="11" fill="#64748b">2</text>
  <text x="360" y="300" font-size="12" fill="#1e293b" text-anchor="middle">清理 darwin 原生模块 + 补齐 linux 变体</text>
  <text x="360" y="318" font-size="10" fill="#64748b" text-anchor="middle">移除 *.node · atomgit-cli-linux-x64 从 npm 补齐</text>

  <!-- Arrow 1→2: 249+5=254 → 278-11=267 -->
  <path d="M360,254 L 360,267" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: y=361, h=54, bottom=415 -->
  <rect x="200" y="361" width="320" height="54" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="375" font-size="11" fill="#64748b">3</text>
  <text x="360" y="383" font-size="12" fill="#1e293b" text-anchor="middle">组装 /opt/codearts（app + unpacked + electron）</text>
  <text x="360" y="401" font-size="10" fill="#64748b" text-anchor="middle">icns → hicolor PNG · 启动脚本 · desktop 文件</text>

  <!-- Arrow 2→3: 332+5=337 → 361-11=350 -->
  <path d="M360,337 L 360,350" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: y=444, h=36, bottom=480 -->
  <rect x="200" y="444" width="320" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="216" y="458" font-size="11" fill="#64748b">4</text>
  <text x="360" y="466" font-size="12" fill="#1e293b" text-anchor="middle">打包 deb / rpm（版本 0.1.26）</text>

  <!-- Arrow 3→4: 415+5=420 → 444-11=433 -->
  <path d="M360,420 L 360,433" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 产物 ============ -->

  <!-- deb: x=140, y=515, w=220, h=36, center=250 -->
  <rect x="140" y="515" width="220" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="250" y="537" font-size="12" fill="#166534" text-anchor="middle">codearts_&lt;ver&gt;_amd64.deb</text>

  <!-- rpm: x=360, y=515, w=220, h=36, center=470 -->
  <rect x="360" y="515" width="220" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="470" y="537" font-size="12" fill="#166534" text-anchor="middle">codearts-&lt;ver&gt;.x86_64.rpm</text>

  <!-- Step4 → 两个产物: 分叉曲线 -->
  <path d="M300,485 C 300,505 250,495 250,504" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M420,485 C 420,505 470,495 470,504" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- sidecar 受限注记（右下角落款区） -->
  <text x="625" y="486" font-size="10" fill="#9d174d" text-anchor="end">⚠ agent-kernel / officecli 无 linux 版</text>
  <text x="625" y="502" font-size="10" fill="#9d174d" text-anchor="end">智能体功能受限（详见 README）</text>

  <!-- 图例（底部之外） -->
  <rect x="95" y="566" width="12" height="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="113" y="578" font-size="10" fill="#64748b">输入</text>
  <rect x="180" y="566" width="12" height="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="198" y="578" font-size="10" fill="#64748b">处理</text>
  <rect x="260" y="566" width="12" height="12" fill="#d1fae5" stroke="#22c55e"/>
  <text x="278" y="578" font-size="10" fill="#64748b">产物</text>
</svg>
