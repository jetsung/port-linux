<svg viewBox="0 0 720 700" width="720" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Title: content x=70..650, center=360 -->
  <text x="360" y="28" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">WorkBuddy 基底合并移植流程</text>
  <text x="360" y="46" font-size="10" fill="#94a3b8" text-anchor="middle">Linux 5.5.6 基底（Electron 37 完整运行时） + Darwin 5.6.2 新版合并</text>

  <!-- ============ 输入源 ============ -->
  <!-- 基底 rpm: x=100, y=64, w=240, h=36, center=220, bottom=100 -->
  <rect x="100" y="64" width="240" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="86" font-size="12" fill="#1e40af" text-anchor="middle">Linux 基底 rpm 5.5.6</text>

  <!-- Darwin zip: x=380, y=64, w=240, h=36, center=500, bottom=100 -->
  <rect x="380" y="64" width="240" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="86" font-size="12" fill="#1e40af" text-anchor="middle">Darwin 新版 zip 5.6.2</text>

  <!-- npm 覆盖: x=380, y=108, w=240, h=28, center=500, bottom=136 -->
  <rect x="380" y="108" width="240" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="500" y="126" font-size="10" fill="#b45309" text-anchor="middle">npm: sandbox 5.6.10 / node-pty</text>

  <!-- 脚本条: x=190, y=152, w=340, h=22, center=360, top=152, bottom=174 -->
  <rect x="190" y="152" width="340" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="167" font-size="11" fill="#64748b" text-anchor="middle">port-workbuddy.sh  — 基底合并</text>

  <!-- 连接：基底 → 脚本条 -->
  <!-- base bottom=100 → script top=152, curve to left half (210, 145→174) -->
  <path d="M220,105 C 220,130 210,135 210,145" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Darwin zip → 脚本条 -->
  <path d="M500,105 C 500,130 510,135 510,145" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- npm → 脚本条（虚线，短距） -->
  <path d="M500,141 L 500,145" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-orange)"/>

  <!-- ============ 处理步骤（垂直主干，center=360） ============ -->

  <!-- Step 1: y=196, w=400, h=36, bottom=232 -->
  <rect x="160" y="196" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="210" font-size="11" fill="#64748b">1</text>
  <text x="360" y="218" font-size="12" fill="#1e293b" text-anchor="middle">解基底 rpm → Linux 完整运行时</text>

  <!-- script → step1: 174+5=179 → 196-11=185 -->
  <path d="M360,179 L 360,185" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: y=260, bottom=296 -->
  <rect x="160" y="260" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="274" font-size="11" fill="#64748b">2</text>
  <text x="360" y="282" font-size="12" fill="#1e293b" text-anchor="middle">解 Darwin 新版 zip → 解压 app.asar</text>
  <!-- Arrow 1→2: 232+5=237 → 260-11=249 -->
  <path d="M360,237 L 360,249" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: y=324, bottom=360, sub-label for cache -->
  <rect x="160" y="324" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="338" font-size="11" fill="#64748b">3</text>
  <text x="360" y="346" font-size="12" fill="#1e293b" text-anchor="middle">合并新版 app.asar 到基底（缓存 vendor）</text>
  <!-- Arrow 2→3: 296+5=301 → 324-11=313 -->
  <path d="M360,301 L 360,313" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: y=388, h=54 (two-line detail), bottom=442 -->
  <rect x="160" y="388" width="400" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="176" y="402" font-size="11" fill="#b45309">4</text>
  <text x="360" y="410" font-size="12" fill="#1e293b" text-anchor="middle">Linux 化（关键修复）</text>
  <text x="360" y="428" font-size="10" fill="#64748b" text-anchor="middle">better-sqlite3 ELF 回填 / sandbox 5.6.10 覆盖 / 补丁</text>
  <!-- Arrow 3→4: 360+5=365 → 388-11=377 -->
  <path d="M360,365 L 360,377" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: y=470, bottom=506 -->
  <rect x="160" y="470" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="484" font-size="11" fill="#64748b">5</text>
  <text x="360" y="492" font-size="12" fill="#1e293b" text-anchor="middle">组装 final/（复用基底 Electron + runtime）</text>
  <!-- Arrow 4→5: 442+5=447 → 470-11=459 -->
  <path d="M360,447 L 360,459" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: y=534, bottom=570 -->
  <rect x="160" y="534" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="548" font-size="11" fill="#64748b">6</text>
  <text x="360" y="556" font-size="12" fill="#1e293b" text-anchor="middle">打包 deb / rpm</text>
  <!-- Arrow 5→6: 506+5=511 → 534-11=523 -->
  <path d="M360,511 L 360,523" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 产物 ============ -->
  <!-- deb: x=100, y=606, w=240, h=36, center=220, bottom=642 -->
  <rect x="100" y="606" width="240" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="220" y="628" font-size="12" fill="#166534" text-anchor="middle">workbuddy_&lt;5.6.2&gt;_amd64.deb</text>

  <!-- rpm: x=380, y=606, w=240, h=36, center=500, bottom=642 -->
  <rect x="380" y="606" width="240" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="500" y="628" font-size="12" fill="#166534" text-anchor="middle">workbuddy-&lt;5.6.2&gt;.x86_64.rpm</text>

  <!-- Step6 → deb / rpm: 570+5=575 → 606-11=595 -->
  <path d="M295,575 C 295,588 220,585 220,595" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M425,575 C 425,588 500,585 500,595" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- 图例（body 之外，底部分散） -->
  <rect x="120" y="662" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="138" y="672" font-size="10" fill="#64748b">输入</text>
  <rect x="190" y="662" width="12" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="208" y="672" font-size="10" fill="#64748b">npm 覆盖</text>
  <rect x="282" y="662" width="12" height="12" rx="2" fill="#f8fafc" stroke="#64748b"/>
  <text x="300" y="672" font-size="10" fill="#64748b">处理</text>
  <rect x="352" y="662" width="12" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="370" y="672" font-size="10" fill="#64748b">关键修复</text>
  <rect x="442" y="662" width="12" height="12" rx="2" fill="#d1fae5" stroke="#22c55e"/>
  <text x="460" y="672" font-size="10" fill="#64748b">产物</text>
  <text x="545" y="672" font-size="9" fill="#94a3b8">基底: 5.5.6 / 新版: 5.6.2</text>
</svg>