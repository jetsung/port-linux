<svg viewBox="0 0 720 730" width="720" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Title: content x=100..620, center=360 -->
  <text x="360" y="28" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">WorkBuddy 基底合并移植流程</text>
  <text x="360" y="46" font-size="10" fill="#94a3b8" text-anchor="middle">Linux 5.6.2 基底（Electron 37 完整运行时） + Darwin 5.8.3 新版合并</text>

  <!-- ============ 输入源（容器外） ============ -->
  <!-- 基底 deb: x=100, y=64, w=240, h=36, center=220, bottom=100 -->
  <rect x="100" y="64" width="240" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="86" font-size="12" fill="#1e40af" text-anchor="middle">Linux 基底 deb 5.6.2</text>

  <!-- Darwin zip: x=380, y=64, w=240, h=36, center=500, bottom=100 -->
  <rect x="380" y="64" width="240" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="86" font-size="12" fill="#1e40af" text-anchor="middle">Darwin 新版 zip 5.8.3</text>

  <!-- npm 覆盖: x=380, y=108, w=240, h=28, center=500, bottom=136 -->
  <rect x="380" y="108" width="240" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="500" y="126" font-size="10" fill="#b45309" text-anchor="middle">npm 覆盖: sandbox / node-pty（npmmirror）</text>

  <!-- ============ debian:13 容器（虚线分组，底层） ============ -->
  <!-- Container: x=130, y=152, w=460, bottom=615; title y=166; note right-aligned x=580 -->
  <rect x="130" y="152" width="460" height="463" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="140" y="166" font-size="11" fill="#64748b">port-workbuddy.sh · debian:13 容器</text>
  <text x="580" y="166" font-size="10" fill="#94a3b8" text-anchor="end">IS_CHINA=1: 清华 apt 源 · npmmirror · CDN 加速</text>

  <!-- 连接：输入 → 脚本条（脚本条 top=176） -->
  <!-- 基底 deb: 共轴垂直直线, 100+5=105 → 176-11=165 -->
  <path d="M220,105 L 220,165" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- Darwin zip: 共轴垂直直线, 105 → 165 -->
  <path d="M500,105 L 500,165" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- npm: x=460 与 Darwin 箭头分离, 136+5=141 → 165 -->
  <path d="M460,141 L 460,165" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-orange)"/>

  <!-- 脚本条: x=190, y=176, w=340, h=22, center=360, bottom=198 -->
  <rect x="190" y="176" width="340" height="22" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="191" font-size="11" fill="#64748b" text-anchor="middle">port-workbuddy.sh  — 基底合并</text>

  <!-- ============ 处理步骤（容器内，垂直主干 center=360） ============ -->

  <!-- Step 1: y=226, w=400, h=36, bottom=262 -->
  <rect x="160" y="226" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="240" font-size="11" fill="#64748b">1</text>
  <text x="360" y="248" font-size="12" fill="#1e293b" text-anchor="middle">解基底 deb（/rpm）→ Linux 完整运行时</text>
  <!-- bar → 1: 198+5=203 → 226-11=215 -->
  <path d="M360,203 L 360,215" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: y=290, bottom=326 -->
  <rect x="160" y="290" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="304" font-size="11" fill="#64748b">2</text>
  <text x="360" y="312" font-size="12" fill="#1e293b" text-anchor="middle">解 Darwin 新版 zip → 解压 app.asar</text>
  <!-- 1→2: 262+5=267 → 290-11=279 -->
  <path d="M360,267 L 360,279" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: y=354, bottom=390 -->
  <rect x="160" y="354" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="368" font-size="11" fill="#64748b">3</text>
  <text x="360" y="376" font-size="12" fill="#1e293b" text-anchor="middle">合并新版 app.asar 到基底（缓存 vendor）</text>
  <!-- 2→3: 326+5=331 → 354-11=343 -->
  <path d="M360,331 L 360,343" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: y=418, h=54（两行）, bottom=472 -->
  <rect x="160" y="418" width="400" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="176" y="432" font-size="11" fill="#b45309">4</text>
  <text x="360" y="440" font-size="12" fill="#1e293b" text-anchor="middle">Linux 化（关键修复）</text>
  <text x="360" y="458" font-size="10" fill="#64748b" text-anchor="middle">better-sqlite3 ELF 回填 / sandbox 覆盖 / 补丁</text>
  <!-- 3→4: 390+5=395 → 418-11=407 -->
  <path d="M360,395 L 360,407" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5: y=500, bottom=536 -->
  <rect x="160" y="500" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="514" font-size="11" fill="#64748b">5</text>
  <text x="360" y="522" font-size="12" fill="#1e293b" text-anchor="middle">组装 final/（复用基底 Electron + runtime）</text>
  <!-- 4→5: 472+5=477 → 500-11=489 -->
  <path d="M360,477 L 360,489" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6: y=564, bottom=600 -->
  <rect x="160" y="564" width="400" height="36" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="176" y="578" font-size="11" fill="#64748b">6</text>
  <text x="360" y="586" font-size="12" fill="#1e293b" text-anchor="middle">打包 deb / rpm（依赖缺失自动跳过）</text>
  <!-- 5→6: 536+5=541 → 564-11=553 -->
  <path d="M360,541 L 360,553" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ 产物（容器外） ============ -->
  <!-- deb: x=100, y=644, w=240, h=36, center=220, bottom=680 -->
  <rect x="100" y="644" width="240" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="220" y="666" font-size="12" fill="#166534" text-anchor="middle">workbuddy_&lt;5.8.3&gt;_amd64.deb</text>

  <!-- rpm: x=380, y=644, w=240, h=36, center=500, bottom=680 -->
  <rect x="380" y="644" width="240" height="36" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="500" y="666" font-size="12" fill="#166534" text-anchor="middle">workbuddy-&lt;5.8.3&gt;.x86_64.rpm</text>

  <!-- 容器 → deb / rpm: 615+5=620 → 644-11=633 -->
  <path d="M220,620 L 220,633" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M500,620 L 500,633" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- 图例（body 之外，整体居中 180..542, center=361） -->
  <rect x="180" y="696" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196" y="706" font-size="10" fill="#64748b">输入</text>
  <rect x="236" y="696" width="12" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="252" y="706" font-size="10" fill="#64748b">npm 覆盖</text>
  <rect x="318" y="696" width="12" height="12" rx="2" fill="#f8fafc" stroke="#64748b"/>
  <text x="334" y="706" font-size="10" fill="#64748b">处理</text>
  <rect x="374" y="696" width="12" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390" y="706" font-size="10" fill="#64748b">关键修复</text>
  <rect x="450" y="696" width="12" height="12" rx="2" fill="#d1fae5" stroke="#22c55e"/>
  <text x="466" y="706" font-size="10" fill="#64748b">产物</text>
  <rect x="506" y="696" width="12" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-dasharray="4,3"/>
  <text x="522" y="706" font-size="10" fill="#64748b">容器</text>
</svg>
